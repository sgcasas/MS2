server:
  port: 8082

spring:
  application:
    name: ms2-menu
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ms2_menu}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    db:
      enabled: true

info:
  app:
    name: ms2-menu
    description: MS2 - Menú y Platos

app:
  public-api-url: ${PUBLIC_API_URL:http://localhost:8082}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
